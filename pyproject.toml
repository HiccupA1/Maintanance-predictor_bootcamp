[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "work-order-management"
version = "0.2.0"
description = "FastAPI backend for Case (Work Order) Management (Contract v0.2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.2",
    "uvicorn==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.37",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.9.2",
    "black==26.10.1",
    "pip-audit==2.10.1",
    "bandit==1.9.4",
]
# Training and offline evaluation (WP3). The scoring worker will need the
# same pins at runtime (WP4).
ml = [
    "scikit-learn==1.9.1",
    "pandas==3.1.1",
    "numpy==2.5.5",
    "joblib==1.6.0",
]

[tool.setuptools.packages.find]
include = ["app*", "ml*"]

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# Line length is owned by the formatter (black). Ruff's E501 duplicates it
# and flags lines black intentionally leaves (long strings, URLs).
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are designed to be called in
# argument defaults; B008 would otherwise flag every endpoint signature.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# Quarantined tests (tests/known_failures.py) are strict xfails: a test that
# starts passing fails the run, forcing its quarantine entry to be removed.
xfail_strict = true
markers = [
    "golden: retrains on the real AI4I dataset (network); run with ML_GOLDEN=1",
]

[tool.coverage.run]
source = ["app", "ml"]
branch = true
