name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,ml]"
      - name: Ruff
        run: ruff check app tests ml tools --output-format=github
      - name: Black
        run: black --check app tests ml tools

  backend-test:
    name: Backend tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pyproject requires-python floor; the runtime image also uses 3.12.
        # numpy 2.5 (ml extra) requires >= 3.12.
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,ml]"
      - name: Pytest
        # Quarantined tests run as strict xfails (tests/known_failures.py).
        run: >
          pytest -o addopts="" -ra
          --junitxml=reports/backend-junit.xml
          --cov --cov-report=xml:reports/backend-coverage.xml
          --cov-report=term
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-py${{ matrix.python }}
          path: reports/
          retention-days: 30

  migrations:
    name: Migrations (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Keep the major version in line with the live Supabase project
        # (Docs/runbooks/database-migrations.md).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workorders
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workorders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,ml]"
      - name: Upgrade to head on an empty database
        run: alembic upgrade head
      - name: Models match migrations (no autogenerate drift)
        run: alembic check
      - name: Downgrade to base and upgrade again
        run: alembic downgrade base && alembic upgrade head
      - name: Supabase path (auth schema present)
        # Exercises the Supabase-only branches (auth.users FK, baseline
        # policies, the D17 lock-down) against a minimal auth stub with
        # Supabase-like default grants.
        env:
          PGPASSWORD: postgres
          SUPABASE_SIM_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/supabase_sim
        run: |
          psql -h localhost -U postgres -d workorders -c "create database supabase_sim"
          psql -h localhost -U postgres -d supabase_sim -v ON_ERROR_STOP=1 -f tests/sql/supabase_auth_stub.sql
          DATABASE_URL="$SUPABASE_SIM_URL" alembic upgrade head
          DATABASE_URL="$SUPABASE_SIM_URL" alembic check
          # D17: no Data API access to application tables at head.
          psql -h localhost -U postgres -d supabase_sim -v ON_ERROR_STOP=1 -f tests/sql/assert_no_data_api_access.sql
          # The baseline alone still reproduces the 8 live policies.
          DATABASE_URL="$SUPABASE_SIM_URL" alembic downgrade 0001_baseline
          test "$(psql -h localhost -U postgres -d supabase_sim -tAc "select count(*) from pg_policies where schemaname = 'public'")" = "8"
          DATABASE_URL="$SUPABASE_SIM_URL" alembic downgrade base
      - name: Schema dump (artifact for comparison with live)
        if: always()
        env:
          INTROSPECT_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: python scripts/introspect_schema.py reports/baseline_schema.txt
      - name: Upload schema dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-schema
          path: reports/baseline_schema.txt
          retention-days: 30

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        # Quarantined tests use it.fails (Docs/stage-5/defect-log.md, D10).
        run: >
          npm test --
          --reporter=default --reporter=junit
          --outputFile.junit=reports/frontend-junit.xml
      - name: Build
        run: npm run build
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: frontend/reports/
          retention-days: 30

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Accepted findings are listed with justification and review dates in
    # Docs/security/risk-register.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pip install -e ".[dev,ml]"
      - name: bandit (Python static analysis, medium+ severity)
        run: bandit -q -r app ml tools scripts -ll
      - name: pip-audit
        run: pip-audit --skip-editable --progress-spinner off
      - name: npm audit, production dependencies (high and above)
        # What ships to browsers. Accepted moderates: RA-2.
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit, all dependencies (critical)
        # Build/test tooling. Accepted highs: RA-1 (no upstream fix).
        if: always()
        working-directory: frontend
        run: npm audit --audit-level=critical

  docker:
    name: Docker image (build, migrate, smoke, scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workorders
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IMAGE: maintenance-api:ci
      DB: postgresql+psycopg2://postgres:postgres@localhost:5432/workorders
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t "$IMAGE" .
      - name: Migrate with the image
        run: docker run --rm --network host -e DATABASE_URL="$DB" "$IMAGE" alembic upgrade head
      - name: Run and smoke test
        run: |
          docker run -d --name api --network host -e DATABASE_URL="$DB" "$IMAGE"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/v1/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/v1/health/db
          # Protected routes must refuse anonymous requests.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/equipment)" = "401"
          # Runs as a non-root user.
          test "$(docker exec api id -u)" != "0"
      - name: API logs
        if: failure()
        run: docker logs api || true
      - name: Vulnerability scan (OS and Python packages)
        # Pinned Trivy image; fails on CRITICAL/HIGH findings that have a fix.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.1 image --scanners vuln \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --no-progress "$IMAGE"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workorders
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workorders
      MODEL_STORE_DIR: /tmp/models
      E2E_DIR: ${{ github.workspace }}/reports/e2e-env
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev,ml]"
      - run: alembic upgrade head
      # The pinned AI4I CSV (SHA-256 checked on load) is cached so that UCI
      # availability rarely affects this blocking job.
      - name: Cache AI4I dataset
        uses: actions/cache@v4
        with:
          path: ml/data/raw
          key: ai4i-dc6630cd9b1f0f853922fad78a1b6436570d3f1ec863f1dd5c4340ac56bc8a8e
      - name: Train the model the UI scores with
        run: python -m ml.pipelines.train_ai4i --version ai4i-v1
      - name: Seed users, signing key and sessions; register model (shadow)
        run: python -m tools.testenv.seed "$E2E_DIR"
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run e2e:install
      - name: Run E2E suite (API + production frontend build)
        working-directory: frontend
        run: npm run e2e
      - name: Workflow comparison report (from the recorded run)
        run: python -m tools.workflow_benchmark.report
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          j = Path("frontend/reports/e2e-junit.xml")
          if j.exists():
              r = ET.parse(j).getroot()
              t, f, s, e = (int(r.get(k, 0)) for k in ("tests", "failures", "skipped", "errors"))
              print(f"### E2E: {t - f - s - e} passed, {f + e} failed, {s} skipped (of {t})")
          c = Path("reports/workflow-comparison.json")
          if c.exists():
              d = json.loads(c.read_text())
              print(f"Workflow: {d['manual_steps']} -> {d['app_steps']} steps (-{d['step_reduction_pct']}%), "
                    f"KLM time -{min(d['time_reduction_pct'].values())}% to -{max(d['time_reduction_pct'].values())}%")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            frontend/reports/
            reports/workflow-app.json
            reports/workflow-comparison.json
            Docs/stage-9/workflow-comparison.md
          retention-days: 30

  load-test:
    name: Load test (Linux, Postgres, real model)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Non-blocking: results are evidence for Docs/stage-9/performance-report.md,
    # not a gate. A shared 4-vCPU runner is noisy, and the load generator
    # shares it with the API.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workorders
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workorders
      MODEL_STORE_DIR: /tmp/models
      # test: allows the harness's file:// JWKS (production requires https).
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,ml]"
      - run: alembic upgrade head
      - name: Train the model the API will score with
        run: python -m ml.pipelines.train_ai4i --version ai4i-v1
      - name: Seed machines, users, tokens; register model (shadow)
        run: python -m tools.loadtest.setup /tmp/lt
      - name: Start API (3 workers; 1 vCPU left for the load generator)
        run: |
          SUPABASE_JWKS_URL=file:///tmp/lt/jwks.json nohup uvicorn app.main:app \
            --host 127.0.0.1 --port 8000 --workers 3 --log-level warning > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/v1/health && break; sleep 1; done
      - name: Load test at 1x (25 users) and 3x (75 users), 60 s each
        run: |
          mkdir -p reports
          python -m tools.loadtest.run --dir /tmp/lt --users 25 --duration 60 --out reports/load-25.json
          python -m tools.loadtest.run --dir /tmp/lt --users 75 --duration 60 --out reports/load-75.json
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          print("| Users | RPS | Errors | p50 ms | p95 ms | p99 ms |\n|---|---|---|---|---|---|")
          for u in (25, 75):
              r = json.load(open(f"reports/load-{u}.json"))
              print(f"| {u} | {r['throughput_rps']} | {r['error_rate']:.2%} | {r['p50_ms']} | {r['p95_ms']} | {r['p99_ms']} |")
          EOF
      - name: Risk scores written during the run
        run: psql postgresql://postgres:postgres@localhost:5432/workorders -tAc "select count(*) from risk_scores" | tee reports/risk-scores.txt
      - name: API log tail
        if: always()
        run: tail -n 50 /tmp/api.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test
          path: reports/
          retention-days: 30

  ml-golden:
    name: ML golden retrain (AI4I)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking: downloads the dataset from UCI, an external site whose
    # availability must not gate merges. A failure here means the published
    # model-card metrics no longer reproduce, and must be investigated.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,ml]"
      - name: Retrain and compare with the model card
        env:
          ML_GOLDEN: "1"
        run: pytest -o addopts="" -ra tests/ml -m golden
      - name: Train and publish the model card
        run: python -m ml.pipelines.train_ai4i --version ci-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: ml-model-card
          path: |
            ml/artifacts/*/model_card.md
            ml/artifacts/*/metrics.json
          retention-days: 30
  # Single required status for branch protection. Lists every blocking job.
  ci-ok:
    name: CI OK
    if: always()
    needs: [backend-lint, backend-test, migrations, frontend, security, docker, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require all blocking jobs to succeed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
