name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests --output-format=github
      - name: Black
        run: black --check app tests

  backend-test:
    name: Backend tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (pyproject requires-python) and current target.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Pytest
        # Quarantined tests run as strict xfails (tests/known_failures.py).
        run: >
          pytest -o addopts="" -ra
          --junitxml=reports/backend-junit.xml
          --cov --cov-report=xml:reports/backend-coverage.xml
          --cov-report=term
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-py${{ matrix.python }}
          path: reports/
          retention-days: 30

  migrations:
    name: Migrations (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking until D5 is fixed (Docs/stage-5/defect-log.md): the
    # Alembic chain cannot build a fresh database. Remove this line in the
    # PR that fixes D5.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workorders
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/workorders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Upgrade to head on an empty database
        run: alembic upgrade head
      - name: Downgrade to base and upgrade again
        run: alembic downgrade base && alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        # Quarantined tests use it.fails (Docs/stage-5/defect-log.md, D10).
        run: >
          npm test --
          --reporter=default --reporter=junit
          --outputFile.junit=reports/frontend-junit.xml
      - name: Build
        run: npm run build
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: frontend/reports/
          retention-days: 30

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Accepted findings are listed with justification and review dates in
    # Docs/security/risk-register.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pip install -e ".[dev]"
      - name: pip-audit
        run: pip-audit --skip-editable --progress-spinner off
      - name: npm audit, production dependencies (high and above)
        # What ships to browsers. Accepted moderates: RA-2.
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit, all dependencies (critical)
        # Build/test tooling. Accepted highs: RA-1 (no upstream fix).
        if: always()
        working-directory: frontend
        run: npm audit --audit-level=critical

  # Single required status for branch protection. Lists every blocking job;
  # the non-blocking migrations job joins this list once D5 is closed.
  ci-ok:
    name: CI OK
    if: always()
    needs: [backend-lint, backend-test, frontend, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require all blocking jobs to succeed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
